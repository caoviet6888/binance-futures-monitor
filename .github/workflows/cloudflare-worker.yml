name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-worker.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CF_ACCOUNT" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Account ID must contain exactly 32 hexadecimal characters."
            exit 1
          fi
          if [[ -z "$CF_TOKEN" || "$CF_TOKEN" =~ [[:space:]] || ! "$CF_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::API token must be the raw token only, without spaces, quotes or Bearer prefix."
            exit 1
          fi
          endpoint="https://api.cloudflare.com/client/v4/user/tokens/verify"
          if [[ "$CF_TOKEN" == cfat_* ]]; then
            endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/tokens/verify"
          fi
          response=$(curl --silent --show-error --max-time 30 -H "Authorization: Bearer $CF_TOKEN" "$endpoint")
          if ! jq -e '.success == true and .result.status == "active"' <<< "$response" >/dev/null; then
            echo "::error::Cloudflare token verification failed. Error codes:"
            jq -r '.errors[]?.code' <<< "$response"
            exit 1
          fi
          echo "Cloudflare token verified active."
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          command: deploy --config cloudflare/wrangler.jsonc
      - name: Verify Worker health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          MONITOR_ACCESS_TOKEN: ${{ secrets.MONITOR_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOYMENT_URL" != https://*.workers.dev ]]; then
            echo "No verified workers.dev deployment URL returned."
            exit 1
          fi
          health=$(curl --fail --silent --show-error --retry 3 --max-time 30 "$DEPLOYMENT_URL/health")
          echo "$health" | jq -e '.status == "online" and .configured == true and .accessConfigured == true' >/dev/null
          echo "Worker online; both Worker secrets configured."
          if [[ -z "$MONITOR_ACCESS_TOKEN" ]]; then
            echo "::notice::Nansen live test skipped: MONITOR_ACCESS_TOKEN is not configured in GitHub Actions."
            exit 0
          fi
          result=$(curl --fail --silent --show-error --max-time 35 -X POST -H "Authorization: Bearer $MONITOR_ACCESS_TOKEN" "$DEPLOYMENT_URL/test")
          echo "$result" | jq -e '.connected == true and .http_status == 200' >/dev/null
          echo "Nansen live test passed."
