<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Radar Pro v1.0</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2b;color:#e5edf8;font:16px system-ui;padding:12px}main{max-width:850px;margin:auto}header{position:sticky;top:0;background:#101b2b;padding:8px 0;z-index:2}button,select,input{font:inherit;color:inherit;background:#20344d;border:1px solid #506783;border-radius:9px;padding:10px}button{cursor:pointer}header button{width:100%;font-weight:bold}section,article{background:#16263a;border:1px solid #344c65;border-radius:12px;padding:12px;margin:8px 0}h1{font-size:21px;margin:4px 0 12px}small{display:block;color:#aebed2;line-height:1.5;margin:6px 0}#tabs,.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.grid{grid-template-columns:1fr 1fr}#tabs button{font-size:13px;padding:9px 3px}#frames,#chartFrames{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}label{padding:4px}input[type=checkbox]{accent-color:#32a9ff}#custom{width:100%;margin:8px 0}.green{color:#50dca5}.red{color:#ff8490}.active{background:#14533c}.loading{background:#59451d}.chosen{background:#245c99}svg{width:100%;background:#101b2b;touch-action:none}svg text{font-size:9px;fill:#dbe8f7}#chart[hidden]{display:none}summary{cursor:pointer}#status{margin:10px 0}</style><main><header><button id="nav">⚡ RADAR</button></header><section><h1>BINANCE RADAR PRO v1.0</h1><div id="tabs"></div><small>MACD 8/17/9 · đảo chiều sớm · dữ liệu Binance Futures độc lập. Điểm thử nghiệm, không phải xác suất thắng.</small><details open><summary>Bộ lọc quét</summary><div class="grid"><select id="group"><option value="btc">BTC & ETH</option><option value="crypto">Tất cả Crypto</option><option value="goods">Vàng · Bạc · Dầu</option><option value="trad">TradFi</option><option value="new">Mới niêm yết</option><option value="all">Tất cả USDT Perp</option><option value="custom">Danh sách riêng</option></sele const $=id=>document.getElementById(id), now110=()=>Date.now(), ema=(a,n)=>{let v=a[0];return a.map(x=>v+=(x-v)*2/(n+1))}, fmt=x=>Number(x.toPrecision(8)).toString(), frames=['1m','3m','5m','15m','1h','4h','1d','1w','1M'], names=['M1','M3','M5','M15','H1','H4','D1','W1','MN1'];
function signal(k){

 const side=m[i-1]<0&&cur>prev&&(d>0||d>m[i-1]-m[i-2])&&prev<0?'LONG':m[i-1]>0&&cur<prev&&(d<0||d<m[i-1]-m[i-2])&&prev>0?'SHORT':null;if(!side)return null;
 const sign=side==='LONG'?1:-1,ratio=side==='LONG'?buy/q:1-buy/q,base=k.slice(-21,-1),avg=base.reduce((s,x)=>s+ +x[7],0)/base.length,frac=Math.max(.05,Math.min(1,(now110()- +k[i][0])/(+k[i][6]- +k[i][0]+1))),rvol=avg>0?q/avg/frac:0,structure=side==='LONG'?p[i]>+k[i-1][2]:p[i]<+k[i-1][3],trend=sign*(p[i]-p[i-1])>0,turn=sign*(m[i-1]-m[i-2])<=0||sign*(h[i-1]-h[i-2])<=0,crossed=sign*cur>=0;

async function start(){reset();const g=gen,fs=[...$('frames').querySelectorAll('input:checked')].map(x=>x.value);if(!fs.length){$('status').textContent='Chọn khung';return}controller=new AbortController();running=true;$('start').className='loading';$('status').textContent='Đang tải danh mục';try{const [info,ticks]=await Promise.all([api('exchangeInfo',controller.signal),api('ticker/24hr',controller.signal)]);if(g!==gen)return;const tm=new Map(ticks.map(x=>[x.symbol,x])),group=$('group').value,goods=/^(XAU|XAUT|PAXG|GOLD|XAG|SILVER|CL|BZ|WTI|BRENT|USOIL|UKOIL|XTI|XBR|OIL)$/;let list=info.symbols.filter(m=>m.status==='TRADING'&&m.quoteAsset==='USDT'&&m.contractType==='PERPETUAL').filter(m=>{const tag=[m.underlyingType,...(m.underlyingSubType||[])].join(' '),commodity=goods.test(m.baseAsset),trad=/stock|equity|tradfi|index|commodity|etf/i.test(tag);return group==='all'||group==='btc'&&['BTC','ETH'].includes(m.baseAsset)||group==='goods'&&commodity||group==='trad'&&trad&&!commodity||group==='crypto'&&!trad&&!commodity||group==='new'&&!trad&&!commodity&&m.onboardDate>Date.now()-2592000000||group==='custom'&&$('custom').value.toUpperCase().split(/[ ,;]+/).includes(m.symbol)});const mode=$('volume').value;if(mode==='10'||mode==='40')list=list.filter(m=>Math.abs(+tm.get(m.symbol)?.priceChangePercent)>=+mode);list.sort((a,b)=>(+tm.get(b.symbol)?.quoteVolume||0)-(+tm.get(a.symbol)?.quoteVolume||0));if(mode==='top100'||mode==='top30')list=list.slice(0,+mode.slice(3));const keys=list.flatMap(m=>fs.map(f=>m.symbol+'|'+f));expected=keys.length;if(!expected)throw Error('Không có mã phù hợp');for(let off=0;off<keys.length&&g===gen;off+=60){const batch=keys.slice(off,off+60);let i=0;await Promise.all(Array.from({length:4},async()=>{while(i<batch.length&&g===gen){const key=batch[i++],[s,t]=key.split('|');try{const k=await api('klines?symbol='+s+'&interval='+t+'&limit=100',controller.signal);if(g!==gen)return;if(k.length<40)throw Error('Thiếu nến');data.set(key,{k,stamp:0});loaded++}c function draw(k){const p=k.map(r=>+r[4]),lo=Math.min(...k.map(r=>+r[3])),hi=Math.max(...k.map(r=>+r[2])),Y=v=>12+(hi-v)/(hi-lo||1)*200,X=i=>8+i*3.3,vol=Math.max(...k.map(r=>+r[7]))||1,a=ema(p,9),b=ema(p,20),m=ema(p,chartSlow?12:8).map((v,i)=>v-ema(p,chartSlow?26:17)[i]),sig=ema(m,9),h=m.map((v,i)=>v-sig[i]),mx=Math.max(...m.map(Math.abs),...sig.map(Math.abs),...h.map(Math.abs))||1,M=v=>330-v/mx*38,path=(v,y,c)=>'<polyline fill="none" stroke="'+c+'" stroke-width="1" points="'+v.map((x,i)=>X(i)+','+y(x)).join(' ')+'"/>';let out='<svg viewBox="0 0 420 390" data-lo="'+lo+'" data-hi="'+hi+'">';for(let i=0;i<4;i++){let v=hi-(hi-lo)*i/3,y=Y(v);out+='<path d="M8 '+y+'H335" stroke="#40536b"/><text x="418" y="'+(y+3)+'" text-anchor="end">'+fmt(v)+'</text>'}k.forEach((r,i)=>{let x=X(i),c=+r[4]>=+r[1]?'#50dca5':'#ff8490',y=Y(Math.max(+r[1],+r[4]));out+='<path stroke="'+c+'" d="M'+x+' '+Y(+r[2])+'V'+Y(+r[3])+'"/><rect fill="'+c+'" x="'+(x-1.2)+'" y="'+y+'" width="2.4" height="'+Math.max(1,Math.abs(Y(+r[1])-Y(+r[4])))+'"/><rect fill="'+c+'" x="'+(x-1.2)+'" y="'+(275-+r[7]/vol*48)+'" width="2.4" height="'+(+r[7]/vol*48)+'"/><rect fill="'+(h[i]>=0?'#50dca5':'#ff8490')+'" x="'+(x-1.2)+'" y="'+Math.min(330,M(h[i]))+'" width="2.4" height="'+Math.max(.5,Math.abs(M(h[i])-330))+'"/>'});out+=path(a,Y,'#ffd16b')+path(b,Y,'#bca2ff')+path(m,M,'#70b6ff')+path(sig,M,'#ffd16b')+'<text x="8" y="222">Volume USDT</text><text x="8" y="385">MACD '+(chartSlow?'12/26/9':'8/17/9')+'</text><g id="measure" visibility="hidden"><path stroke="white"/><text x="418" text-anchor="end" fill="white"/></g></svg>';$('plot').innerHTML=out;const svg=$('plot').firstChild,g=svg.querySelector('#measure');function move(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const y=Math.max(12,Math.min(212,pt.matrixTransform(svg.getScreenCTM().inverse()).y));g.setAttribute('visibility','visible');g.children[0].setAttribute('d','M8 '+y+'H335');g.children[1].setAttribute('y',y+3);g.children[1].textContent=fmt(hi-(y $('start').onclick=start;$('stop').onclick=stop;for(const id of ['group','volume','custom','frames'])$(id).onchange=reset;$('tabs').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}};$('rows').onclick=e=>{if(e.target.dataset.chart){chartKey=e.target.dataset.chart;chartFrame=chartKey.split('|')[1];$('chart').hidden=false;chart();$('chart').scrollIntoView()}};$('chartFrames').innerHTML=frames.map((f,i)=>'<button data-frame="'+f+'">'+names[i]+'</button>').join('');$('chartFrames').onclick=e=>{if(e.target.dataset.frame){chartFrame=e.target.dataset.frame;chart()}};$('macd').onclick=()=>{chartSlow=!chartSlow;chart()};$('close').onclick=()=>{chartGen++;$('chart').hidden=true};$('refresh').onclick=chart;setInterval(render,1500);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)stop()});render();
