const el=id=>document.getElementById(id),out=el("nsOut629");
function choose(symbol){selected=symbol;el("nsSymbol629").value=symbol;const k=known[symbol.replace(/USDT$/,"")];el("nsAddress629").value=k?k[1]:"";if(k)el("nsChain629").value=k[0];out.textContent="Xác minh chain và địa chỉ trước khi tra cứu.";}
el("nsSymbol629").addEventListener("change",()=>choose(el("nsSymbol629").value.trim().toUpperCase()));

el("nsHealth629").onclick=async()=>{try{const r=await fetch(base+"/health",{cache:"no-store"}),j=await r.json();out.textContent=r.ok&&j.configured&&j.accessConfigured?"Worker online · hai secret đã cấu hình.":"Worker chưa sẵn sàng.";}catch{out.textContent="Không kết nối được Worker.";}};
const fmt=v=>v===null||v===undefined||v===""||!Number.isFinite(Number(v))?"—":Number(v).toLocaleString("vi-VN",{maximumFractionDigits:4});
panel.addEventListener("click",async e=>{const kind=e.target.dataset.ns;if(!kind||busy)return;if(!token){out.textContent="Nhập token truy cập trước.";return;}const chain=el("nsChain629").value,address=el("nsAddress629").value.trim(),timeframe=el("nsTime629").value;if(!(chain==="solana"?/^[1-9A-HJ-NP-Za-km-z]{32,44}$/:/^0x[a-fA-F0-9]{40}$/).test(address)){out.textContent="Địa chỉ không hợp lệ.";return;}busy=true;out.textContent="Đang tải Nansen…";try{const r=await fetch(base+"/"+kind,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({chain,token_address:address,timeframe})});const j=await r.json();if(!r.ok||!j.connected)throw Error("HTTP "+r.status+" · kiểm tra token, quyền API hoặc credits");const rows=j.data?.data;if(!Array.isArray(rows)||!rows.length){out.textContent="Không có dữ liệu trả về.";return;}const lines=[chain+" · "+address+" · "+new Date().toLocaleString("vi-VN")];if(kind==="flow"){for(const row of rows)for(const [label,key] of [["Smart Money","smart_trader_net_flow_usd"],["Cá voi","whale_net_flow_usd"],["Ví sàn","exchange_net_flow_usd"],["Ví mới","fresh_wallets_net_flow_usd"],["Top PnL","top_pnl_net_flow_usd"]])lines.push(label+": "+fmt(row[key])+" USD");}else rows.forEach((x,i)=>lines.push((i+1)+". "+(x.address_label||"Ví chưa gắn nhãn")+" · "+(x.address||"—")+"\nSố token: "+fmt(x.token_amount)+" | USD: "+fmt(x.value_usd)+" | Sở hữu: "+fmt(x.ownership_percentage)+"%"));out.textContent=lines.join("\n\n");}catch(err){out.textContent="Lỗi Nansen: "+err.message;}finally{busy=false;}});
