btn.onclick=async()=>{const n=++run;scanCtl?.abort();scanCtl=new AbortController();const signal=scanCtl.signal;ctl.signal.addEventListener('abort',()=>scanCtl.abort(),{once:true});btn.disabled=true;out.replaceChildren();snapshot=[];stats={done:0,total:0,errors:0};renderB();let rows=[],errors=0,done=0,reasons={},failed=[];const frame=tf.value;scanFrame=frame;const requested=onlySymbol;onlySymbol='';const step=({'3m':3,'5m':5,'15m':15,'1h':60,'4h':240,'1d':1440})[frame]*60000;const active=()=>id===epoch&&n===run&&!signal.aborted;try{status.textContent='BYBIT · tải danh mục';const all=await api.instruments(signal);const list=requested?all.filter(x=>x.symbol===requested):all;if(!list.length)throw Error('Không tìm thấy hợp đồng Bybit');if(!active())return;stats.total=list.length;renderB();let cursor=0;async function worker(){while(active()&&cursor<list.length){const sym=list[cursor++].symbol;try{let raw;for(let attempt=0;attempt<3;attempt++){try{raw=await api.candles(sym,frame,200,signal);break}catch(err){if(signal.aborted||attempt===2)throw err;await new Promise(r=>setTimeout(r,Math.max(700*(attempt+1),api.pauseUntil-Date.now())));}}const a=raw.filter(x=>x.time+step<=Date.now());if(a.length<100)throw Error('Thiếu lịch sử nến');if(Date.now()-(a.at(-1).time+step)>step*1.5)throw Error('Nến quá cũ');if(a.some((x,i)=>i&&x.time-a[i-1].time!==step))throw Error('Hở nến');const c=a.map(x=>x.close),e=ema(c,9),m=ema(c,20),f=ema(c,12),s=ema(c,26),d=f.map((x,i)=>x-s[i]),g=ema(d,9),i=c.length-1;const side=e[i]>m[i]&&d[i]>g[i]&&d[i-1]<=g[i-1]?'LONG':e[i]<m[i]&&d[i]<g[i]&&d[i-1]>=g[i-1]?'SHORT':'';const stamp=new Date(a[i].time+step).toLocaleString('vi-VN',{hour12:false});const add=(side,kind)=>rows.push([sym,side,c[i],stamp,kind]);if(side)add(side,'RADAR');const k=a[i],prev=a[i-1],range=k.high-k.low,body=Math.abs(k.close-k.open);if(range>0&&body/range>=0.55){if(k.close>k.open&&k.close>prev.high&&e[i]>m[i])add('LONG','CANDLE_LONG');if(k.close<k.open&&k.close<prev.low&&e[i]<m[i])add('SH
