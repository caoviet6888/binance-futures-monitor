<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Futures Monitor v4.12</title><style>body{background:#0b1220;color:#e6edf7;font:18px system-ui;padding:24px}#state{max-width:720px;margin:20vh auto;line-height:1.6}</style></head><body><div id="state">Đang tải Binance Futures Monitor v4.12 từ mã nguồn v4.11...</div><script>
(async()=>{
 const root=document.getElementById('state');
 try{
  const r=await fetch('./index-v4-11-coingecko-resume.html',{cache:'no-store'});
  if(!r.ok)throw Error('Không tìm thấy v4.11 (HTTP '+r.status+')');
  let s=await r.text();
  const start=s.indexOf('async function loadMarketCaps(){');
  const end=s.indexOf('\nfunction refreshGroups()',start);
  if(start<0||end<0)throw Error('Mã nguồn v4.11 không khớp cấu trúc cần cập nhật');
  s=s.slice(0,start)+"async function loadMarketCaps(){\n if(capLoading)return;\n capLoading=true;$('loadCaps').disabled=true;\n const status=$('capStatus'),key='bfm412_target_caps',listKey='bfm412_coin_list';\n const save=(state)=>{store(key,state);capBySymbol=new Map(state.items||[]);capUpdated=state.updated||0;capPartial=true;capCoverage=state.coverage||'Đối chiếu có mục tiêu';render()};\n const get=async(url)=>{\n  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),25000);\n  try{const r=await fetch(url,{signal:ctrl.signal,cache:'no-store'});if(!r.ok){const e=new Error('HTTP '+r.status+(r.headers.get('Retry-After')?' · Retry-After '+r.headers.get('Retry-After'):'') );e.status=r.status;throw e}return await r.json()}finally{clearTimeout(timer)}\n };\n try{\n  let st=read(key,{items:[],done:[],updated:0,coverage:''});\n  if(!st||!Array.isArray(st.items)||!Array.isArray(st.done))st={items:[],done:[],updated:0,coverage:''};\n  const wanted=new Set(universe.map(coinBase).filter(Boolean));\n  if(!wanted.size){status.textContent='⚠️ Chưa có danh sách hợp đồng. Hãy bấm Quét ngay một lần rồi tải vốn hóa.';return}\n  let list=read(listKey,null);\n  if(!list||!Array.isArray(list.items)||Date.now()-list.time>24*3600000){\n   status.textContent='Đang tải danh mục định danh CoinGecko (một lần, lưu 24 giờ)...';\n   const arr=await get('https://api.coingecko.com/api/v3/coins/list?include_platform=false');\n   if(!Array.isArray(arr)||arr.length<1000)throw Error('Danh mục CoinGecko không hợp lệ');\n   list={time:Date.now(),items:arr.map(c=>[String(c.symbol||'').toUpperCase(),c.id,c.name])};\n   store(listKey,list);\n  }\n  const grouped=new Map();\n  for(const [sym,id,name] of list.items){if(!wanted.has(sym)||!id)continue;if(!grouped.has(sym))grouped.set(sym,[]);grouped.get(sym).push({id,name})}\n  const unique=new Map([...grouped].filter(([sym,ids])=>ids.length===1).map(([sym,ids])=>[ids[0].id,sym]));\n  const done=new Set(st.done),ids=[...unique.keys()].filter(id=>!done.has(id));\n  const batch=ids.slice(0,100),verified=new Map(st.items);\n  if(!batch.length){st.coverage='Đã xử lý '+done.size+' ID duy nhất · '+([...wanted].filter(x=>(grouped.get(x)||[]).length!==1).length)+' mã thiếu/trùng chưa xác minh';st.updated=Date.now();save(st);status.textContent='✓ '+st.coverage;return}\n  status.textContent='Đang xác minh '+batch.length+' coin · đã xử lý '+done.size+'/'+unique.size+' · không tải 30 trang';\n  const url='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+encodeURIComponent(batch.join(','))+'&order=market_cap_desc&per_page=250&page=1&sparkline=false';\n  const arr=await get(url);\n  if(!Array.isArray(arr))throw Error('Dữ liệu vốn hóa không hợp lệ');\n  const byId=new Map(arr.map(c=>[c.id,c]));\n  for(const id of batch){\n   const c=byId.get(id),sym=unique.get(id);\n   if(c&&String(c.symbol||'').toUpperCase()===sym&&Number.isFinite(Number(c.market_cap))&&Number(c.market_cap)>0)verified.set(sym,{id,name:c.name,cap:Number(c.market_cap)});\n   else verified.delete(sym);\n   done.add(id);\n  }\n  st.items=[...verified];st.done=[...done];st.updated=Date.now();\n  st.coverage='Đã xác minh '+verified.size+' mã · xử lý '+done.size+'/'+unique.size+' ID duy nhất · '+([...wanted].filter(x=>(grouped.get(x)||[]).length!==1).length)+' mã thiếu/trùng chưa xác minh';\n  save(st);status.textContent='✓ '+st.coverage+(done.size<unique.size?' · Bấm tiếp để xác minh đợt sau':' · Đã hết danh sách mục tiêu');\n }catch(e){status.textContent='⚠️ '+(e.name==='AbortError'?'Hết thời gian 25 giây':e.message||String(e))+' · Dữ liệu cũ được giữ lại; thử lại sau.'}\n finally{capLoading=false;$('loadCaps').disabled=false}\n}"+s.slice(end);
  s=s.replaceAll('v4.11','v4.12');
  s=s.replace('Tải / tiếp tục vốn hóa (5 trang mỗi đợt)','Xác minh vốn hóa (100 mã/đợt)');
  s=s.replace("const c=read('bfm411_cap_cache',null)","const c=read('bfm412_target_caps',null)");
  s=s.replace("if(c&&Date.now()-c.time<6*3600000&&Array.isArray(c.items)){capBySymbol=new Map(c.items);capUpdated=c.time;capCoverage=c.coverage||'Cache';capPartial=!!c.partial;","if(c&&Date.now()-c.updated<24*3600000&&Array.isArray(c.items)){capBySymbol=new Map(c.items);capUpdated=c.updated;capCoverage=c.coverage||'Cache';capPartial=true;");
  document.open();document.write(s);document.close();
 }catch(e){root.textContent='Không thể khởi động v4.12: '+e.message+' . Cần tải file v4.11 lên cùng thư mục GitHub Pages.';}
})();
</script></body></html>
