function flowStats(k){const w=k.slice(-20),q=w.reduce((s,r)=>s+ +r[7],0),buy=w.reduce((s,r)=>s+ +r[10],0),delta=w.map(r=>2*+r[10]- +r[7]),cvd=delta.reduce((a,b)=>a+b,0),base=k.slice(-21,-1),avg=base.reduce((s,r)=>s+ +r[7],0)/base.length,typ=r=>(+r[2]+ +r[3]+ +r[4])/3;let pos=0,neg=0,cm=0;for(let i=k.length-14;i<k.length;i++){let v=typ(k[i])*+k[i][5];if(typ(k[i])>typ(k[i-1]))pos+=v;else if(typ(k[i])<typ(k[i-1]))neg+=v}for(const r of w){let range=+r[2]- +r[3];if(range)cm+=(2*+r[4]- +r[2]- +r[3])/range*+r[7]}return {q,buy,cvd,ratio:q?buy/q:0,rvol:avg?+k.at(-1)[7]/avg:0,mfi:pos+neg?100*pos/(pos+neg):50,cmf:q?cm/q:0,vwap:w.reduce((s,r)=>s+ +r[5],0)>0?q/w.reduce((s,r)=>s+ +r[5],0):0}}

function showFlow(k){let f=flowStats(k),last=k.at(-1),prev=k.slice(-21,-1),low=Math.min(...prev.map(r=>+r[3])),high=Math.max(...prev.map(r=>+r[2])),sweep=+last[3]<low&&+last[4]>low?'Quét đáy':+last[2]>high&&+last[4]<high?'Quét đỉnh':+last[4]>high?'Phá đỉnh':+last[4]<low?'Phá đáy':'Chưa phá cấu trúc';$('flow').innerHTML='<article><b>SMART MONEY · 20 nến gồm nến chạy</b><small>Mua '+(f.ratio*100).toFixed(1)+'% · Bán '+((1-f.ratio)*100).toFixed(1)+'%</small><div style="height:8px;background:#ff8490;border-radius:8px"><div style="height:8px;background:#50dca5;width:'+f.ratio*100+'%;border-radius:8px"></div></div><small>CVD '+fmt(f.cvd)+' USDT · RVOL '+f.rvol.toFixed(2)+'× (chưa hiệu chỉnh tiến độ nến) · MFI '+f.mfi.toFixed(1)+' · CMF '+f.cmf.toFixed(3)+' · VWAP20 '+fmt(f.vwap)+'</small><small>'+sweep+' · Dòng tiền giao dịch chủ động, không phải nạp/rút.</small></article>'}
let deepGen=0;
$('deep').onclick=async()=>{const g=++deepGen,s=chartKey.split('|')[0],box=$('deepResult');box.textContent='Đang tải chuyên sâu…';const get=async p=>{const a=new AbortController(),t=setTimeout(()=>a.abort(),10000);try{let r=await fetch('https://fapi.binance.com/'+p,{signal:a.signal});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}};let [book,oi,fund,top,trades]=await Promise.allSettled([get('fapi/v1/depth?symbol='+s+'&limit=20'),get('futures/data/openInterestHist?symbol='+s+'&period=5m&limit=2'),get('fapi/v1/premiumIndex?symbol='+s),get('futures/data/topLongShortPositionRatio?symbol='+s+'&period=5m&limit=1'),get('fapi/v1/aggTrades?symbol='+s+'&limit=500')]);if(g!==deepGen||s!==chartKey.split('|')[0]||$('chart').hidden)return;let lines=[];if(book.status==='fulfilled'){let b=book.value,not=a=>a.reduce((v,r)=>v+ +r[0]*+r[1],0),x=not(b.bids),y=not(b.asks);lines.push('Sổ lệnh 20 mức: mua '+(100*x/(x+y)).toFixed(1)+'% (lệnh chờ, có thể hủy)')}if(oi.status==='fulfilled'&&oi.value.length===2){let a=+oi.value[0].sumOpenInterest,b=+oi.value[1].sumOpenInterest;if(a>0)lines.push('OI 5 phút: '+((b/a-1)*100).toFixed(2)+'%')}if(fund.status==='fulfilled')lines.push('Funding: '+(+fund.value.lastFundingRate*100).toFixed(4)+'%');if(top.status==='fulfilled'&&top.value.length)lines.push('Top Trader tỷ lệ vị thế L/S: '+Number(top.value[0].longShortRatio).toFixed(2));if(trades.status==='fulfilled'&&trades.value.length){let a=trades.value,lo=Math.min(...a.map(t=>+t.p)),hi=Math.max(...a.map(t=>+t.p)),step=(hi-lo)/20||lo*.0001||1,bins=Array(20).fill(0);for(let t of a)bins[Math.min(19,Math.floor((+t.p-lo)/step))]+=+t.p*+t.q;let i=bins.indexOf(Math.max(...bins));lines.push('POC mẫu '+a.length+' giao dịch: '+fmt(lo+(i+.5)*step)+' (không phải toàn phiên)')}box.textContent='';for(let line of lines){let el=document.createElement('small');el.textContent=line;box.append(el)}let note=document.createElement('small');note.textContent='Nguồn Binance · '+new Date().toLocaleTimeString()+' · '+[book,oi,fund,top,trades].filter(x=>x.status==='rejected').length+' nguồn lỗi';box.append(note)};
