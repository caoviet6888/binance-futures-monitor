<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Binance Futures Monitor v4.16</title><style>html,body{margin:0;height:100%;background:#0b1220;color:#e8eff9;font-family:system-ui}iframe{display:block;border:0;width:100%;height:100dvh}#error{display:none;padding:20px;line-height:1.7}</style></head><body><iframe id="monitor" src="./index-v4-15-3-valid-entry-first.html" title="Binance Futures Monitor v4.16"></iframe><div id="error"><h2>Không thể tải bản nền v4.15.3</h2><p>Hãy tải tệp v4.16 lên cùng thư mục GitHub với <code>index-v4-15-3-valid-entry-first.html</code>. Cả hai tệp phải nằm cùng một tên miền GitHub Pages.</p></div><script>
const patch="\n(function(){\n'use strict';\nconst $x=id=>document.getElementById(id);\nconst originalAnalyse=analyse, originalRender=render, originalSelected=selectedEvents;\nconst TF_LABEL={'5m':'M5','15m':'M15','1h':'H1','4h':'H4','1d':'D1'};\nfunction evaluateCrosses(raw, tf){\n const k=raw.filter(x=>+x[6]<Date.now());\n if(k.length<75)return [];\n const close=k.map(x=>+x[4]), e9=ema(close,9),e20=ema(close,20),m=macd(close,8,17,9),s=macd(close,12,26,9), out=[];\n const end=k.length-1;\n for(let i=45;i<=end;i++){\n  const side=crossAt(e9,e20,i);if(!side)continue;\n  const A=atr(k.slice(0,i+1));if(!(Number.isFinite(A)&&A>0))continue;\n  const entry=close[i],sgn=side==='LONG'?1:-1,sl=entry-sgn*1.5*A,tp=entry+sgn*2*A;\n  const macdFast=sgn*(m.line[i]-m.signal[i])>0,macdStandard=sgn*(s.line[i]-s.signal[i])>0;\n  let result='PENDING',bars=0;\n  for(let j=i+1;j<=Math.min(i+6,end);j++){\n   const hi=+k[j][2],lo=+k[j][3],hitSL=side==='LONG'?lo<=sl:hi>=sl,hitTP=side==='LONG'?hi>=tp:lo<=tp;\n   bars=j-i;\n   if(hitSL&&hitTP){result='AMBIGUOUS';break}\n   if(hitSL){result='SL';break}\n   if(hitTP){result='TP';break}\n  }\n  if(result==='PENDING'&&end-i>=6)result='NO_HIT_6';\n  out.push({tf,side,time:+k[i][6],entry,sl,tp,result,bars,macdFast,macdStandard});\n }\n return out;\n}\nanalyse=function(klines,meta,tf){\n const result=originalAnalyse(klines,meta,tf);\n if(result)result.auditV416=evaluateCrosses(klines,tf);\n return result;\n};\nconst state=$x('state');\nif(state&&!state.querySelector('[value=\"readyonly\"]')){\n const opt=document.createElement('option');opt.value='readyonly';opt.textContent='✅ Chỉ READY TRADE · điểm vào hợp lệ';state.insertBefore(opt,state.firstChild);\n}\nselectedEvents=function(){\n if($x('state')?.value!=='readyonly')return originalSelected();\n const old=$x('state').value;$x('state').value='valid';\n let rows;try{rows=originalSelected()}finally{$x('state').value=old}\n return rows.filter(e=>{try{return tradePlan(e,relatedSignals(e)).actionable===true}catch{return false}})\n  .sort((a,b)=>tradePlan(b,relatedSignals(b)).score-tradePlan(a,relatedSignals(a)).score||b.time-a.time);\n};\nconst panel=document.createElement('section');panel.className='panel';panel.style.marginTop='12px';\npanel.innerHTML='<h2>📊 v4.16 · Kiểm chứng giao cắt & điểm vào</h2><p class=\"muted\">Thống kê hồi cứu EMA9/20 theo nến đã đóng. Entry = giá đóng nến giao cắt; SL = 1,5 ATR; TP = 2 ATR; tối đa 6 nến tiếp theo. Nếu một nến chạm cả TP và SL, kết quả KHÔNG XÁC ĐỊNH (không giả định thắng). Chưa chạm sau 6 nến được tách riêng. Đây không phải backtest READY TRADE hoặc tỷ lệ thắng giao dịch thực tế.</p><div id=\"v416summary\" class=\"muted\">Chưa có dữ liệu quét.</div><div id=\"v416table\" class=\"tablewrap\" style=\"margin-top:10px\"></div><div class=\"actions\"><button id=\"v416csv\">⬇ Xuất kiểm chứng CSV</button><button id=\"v416ready\">✅ Xem READY TRADE</button><button id=\"v416all\">↩ Xem tất cả tín hiệu</button></div><p class=\"muted\">MACD cùng chiều được đo tại nến giao cắt EMA9/20, không phải giao cắt MACD đồng thời. Kết quả không tính phí, trượt giá hay funding. Không cộng điểm thắng cho tín hiệu chưa rõ kết quả.</p>';\nconst metrics=$x('metrics');if(metrics?.parentElement)metrics.parentElement.insertAdjacentElement('afterend',panel);else document.querySelector('main').append(panel);\nfunction records(){const out=[];for(const [symbol,frames] of data.entries())for(const x of Object.values(frames))for(const t of x.auditV416||[])out.push({symbol,...t});return out}\nfunction stats(rows){const count=x=>rows.filter(x).length,tp=count(x=>x.result==='TP'),sl=count(x=>x.result==='SL');return {n:rows.length,tp,sl,pending:count(x=>x.result==='PENDING'),nohit:count(x=>x.result==='NO_HIT_6'),amb:count(x=>x.result==='AMBIGUOUS'),pct:tp+sl?(100*tp/(tp+sl)).toFixed(1)+'%':'—'}}\nfunction auditRender(){\n const rows=records(),sum=stats(rows);$x('v416summary').textContent='Đã ghi nhận '+sum.n+' giao cắt · TP '+sum.tp+' · SL '+sum.sl+' · Chưa đủ 6 nến '+sum.pending+' · Không chạm sau 6 nến '+sum.nohit+' · Một nến chạm cả hai '+sum.amb+'. Tỷ lệ TP trong mẫu xác định: '+sum.pct+'.';\n const body=[];for(const tf of ['5m','15m','1h','4h','1d'])for(const side of ['LONG','SHORT'])for(const macd of ['all','fast','both']){\n  const a=rows.filter(x=>x.tf===tf&&x.side===side&&(macd==='all'||macd==='fast'&&x.macdFast||macd==='both'&&x.macdFast&&x.macdStandard));const t=stats(a);\n  body.push('<tr><td>'+TF_LABEL[tf]+'</td><td class=\"'+(side==='LONG'?'long':'short')+'\">'+side+'</td><td>'+(macd==='all'?'Tất cả':macd==='fast'?'MACD nhanh cùng chiều':'Cả 2 MACD cùng chiều')+'</td><td>'+t.n+'</td><td>'+t.tp+'</td><td>'+t.sl+'</td><td>'+t.pending+'</td><td>'+t.nohit+'</td><td>'+t.amb+'</td><td>'+t.pct+'</td></tr>');\n }\n $x('v416table').innerHTML='<table><thead><tr><th>Khung</th><th>Chiều</th><th>Nhóm</th><th>Tổng</th><th>TP</th><th>SL</th><th>Chờ</th><th>Hết 6 nến</th><th>Không rõ</th><th>TP/(TP+SL)</th></tr></thead><tbody>'+body.join('')+'</tbody></table>';\n const oldState=$x('state').value;$x('state').value='valid';let signals;try{signals=originalSelected()}finally{$x('state').value=oldState}let ready=0;for(const e of signals)try{if(tradePlan(e,relatedSignals(e)).actionable)ready++}catch{}\n const b=$x('v416ready');b.textContent='✅ Xem READY TRADE ('+ready+' sự kiện trong bộ lọc)';\n}\nlet lastAudit=0;\nrender=function(){originalRender();if(Date.now()-lastAudit>1500){lastAudit=Date.now();auditRender()}};\n$x('v416ready').onclick=()=>{$x('state').value='readyonly';$x('sort').value='entry';render();$x('signalCards').scrollIntoView({behavior:'smooth',block:'start'})};\n$x('v416all').onclick=()=>{$x('state').value='valid';$x('sort').value='entry';render()};\n$x('v416csv').onclick=()=>{\n const rows=records(),cols=['symbol','tf','side','time','entry','sl','tp','result','bars','macdFast','macdStandard'];\n const csv=[cols.join(','),...rows.map(r=>cols.map(k=>'\"'+String(k==='time'?new Date(r[k]).toISOString():r[k]??'').replace(/\"/g,'\"\"')+'\"').join(','))].join('\\r\\n');\n const url=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='binance-v416-cross-audit.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);\n};\nconst heading=document.querySelector('h1');if(heading)heading.textContent=heading.textContent.replace('v4.15.3','v4.16');\nconst description=document.createElement('p');description.className='muted';description.textContent='v4.16: ưu tiên READY TRADE, lọc điểm vào hợp lệ, thống kê EMA9/20 LONG/SHORT và MACD theo từng khung. Giữ nguyên kiểm tra rủi ro và bộ quét v4.15.3.';heading?.insertAdjacentElement('afterend',description);\nrender();\n})();\n";
const frame=document.getElementById('monitor');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;if(!doc||!doc.getElementById('start'))throw Error('Không thấy bộ quét nền');const script=doc.createElement('script');script.textContent=patch;doc.body.appendChild(script);if(!doc.getElementById('v416summary'))throw Error('Không khởi tạo được nâng cấp');}catch(e){frame.style.display='none';const el=document.getElementById('error');el.style.display='block';el.insertAdjacentHTML('beforeend','<p>'+String(e.message).replaceAll('<','&lt;')+'</p>')}});
</script></body></html>
