<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hyperliquid Radar Beta 1</title><style>*{box-sizing:border-box}body{background:#101827;color:#e4edf9;font:16px system-ui;margin:12px}main{max-width:1000px;margin:auto}h1{color:#efc568;font-size:24px}button,select{background:#23364e;color:#fff;border:1px solid #526b85;border-radius:8px;padding:12px;margin:3px;font:inherit}article,section{background:#18263a;border:1px solid #40536b;border-radius:10px;padding:12px;margin:8px 0}p{margin:6px 0}.long{color:#4de1a7}.short{color:#ff858c}canvas{width:100%;height:320px}small{color:#b4c3d6}</style><main><h1>HYPERLIQUID FUTURES RADAR · BETA 1</h1><p id="market">Đang tải thị trường</p><section><select id="limit"><option value="30">Top 30 thanh khoản</option><option value="60">Top 60</option><option value="0">Tất cả perp chính</option></select><button id="scan">Quét ngay</button><button id="stop">Dừng</button><p id="status">Chờ quét</p><p id="counts"></p><small>Nến đóng · EMA9/MA20 · MACD12/26/9 · M3:20, M5:15, M15+:10 · WATCH, chưa xác nhận Entry</small></section><section><select id="coin"></select><select id="tf"><option>3m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option></select><button id="open">Mở biểu đồ</button><p id="chartstatus"></p><canvas id="canvas"></canvas></section><select id="side"><option value="">Tất cả tín hiệu</option><option value="1">LONG</option><option value="-1">SHORT</option></select><div id="results"></div><small>CVD, lịch sử dòng tiền, Entry/SL/TP chưa triển khai. Không đặt lệnh.</small></main><script>const $=id=>document.getElementById(id), api='https://api.hyperliquid.xyz/info', frames=['3m','5m','15m','1h','4h'], ms=[180000,300000,900000,3600000,14400000];let markets=[],rows=[],busy=false,stop=false,ws,active='',timer;const num=x=>Number(x),fmt=x=>Number.isFinite(x)?x.toLocaleString('en-US',{maximumFractionDigits:6}):'—';async function post(body){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function ema(a,n){let v=a[0];return a.map(x=>v+=(x-v)*2/(n+1))}function calc(raw,k){const a=raw.filter(x=>+x.T<Date.now()).sort((a,b)=>a.t-b.t);if(a.length<60||a.some((x,i)=>i&&x.t-a[i-1].t!==ms[k]))return null;const c=a.map(x=>+x.c),e=ema(c,9),m=c.map((_,i)=>i<19?NaN:c.slice(i-19,i+1).reduce((s,v)=>s+v,0)/20),f=ema(c,12),g=ema(c,26),mac=f.map((v,i)=>v-g[i]),sig=ema(mac,9),h=mac.map((v,i)=>v-sig[i]),i=c.length-1,d=e[i]-m[i],prev=e[i-1]-m[i-1],dir=d>0?1:-1;let phase=0;for(let j=i-1;j>=19&&Math.sign(e[j]-m[j])===-dir;j--)phase++;let old=0;for(let j=i-1;j>=19&&Math.sign(e[j]-m[j])===Math.sign(prev);j--)old++;const cross=dir*prev<=0,approach=Math.abs(d)<Math.abs(prev)&&Math.abs(d)/c[i]<.002;const md=mac[i]-sig[i],mp=mac[i-1]-sig[i-1],mdDir=md>0?1:-1,mc=mdDir*mp<=0;let mpLen=0;for(let j=i-1;j>=0&&Math.sign(h[j])===Math.sign(mp);j--)mpLen++;const min=[20,15,10,10,10][k],vol=a.slice(-21,-1).reduce((s,x)=>s+ +x.v,0)/20,rvol=vol>0?+a[i].v/vol:0;const mean=m[i],sd=Math.sqrt(c.slice(-20).reduce((s,x)=>s+(x-mean)**2,0)/20),bw=mean?4*sd/mean*100:0;const signal=cross&&old>=min?dir:mc&&mpLen>=min?mdDir:approach&&old>=min?-dir:0;return {signal,kind:cross&&old>=min?'EMA vừa cắt':mc&&mpLen>=min?'MACD vừa cắt':signal?'EMA sắp cắt':'—',rvol,bw,price:c[i],a,e,m,h,mac,sig}}async function load(){const [meta,ctx]=await post({type:'metaAndAssetCtxs'});markets=meta.universe.map((x,i)=>({coin:x.name,del:x.isDelisted,price:+ctx[i]?.markPx,vol:+ctx[i]?.dayNtlVlm,oi:+ctx[i]?.openInterest,funding:+ctx[i]?.funding})).filter(x=>!x.del&&Number.isFinite(x.price)).sort((a,b)=>b.vol-a.vol);$('market').textContent=markets.length+' hợp đồng perp chính';$('coin').replaceChildren(...markets.map(x=>new Option(x.coin,x.coin)));render()}async function scan(){if(busy)return;busy=true;stop=false;rows=[];let ok=0,fail=0,done=0;try{await load();const scope=markets.slice(0,+$('limit').value||markets.length),jobs=scope.flatMap(m=>frames.map((tf,k)=>({m,tf,k})));for(let j=0;j<jobs.length&&!stop;j+=3){await Promise.all(jobs.slice(j,j+3).map(async({m,tf,k})=>{try{const end=Date.now(),a=await post({type:'candleSnapshot',req:{coin:m.coin,interval:tf,startTime:end-ms[k]*121,endTime:end}}),v=calc(a,k);if(!v)throw Error('thiếu nến');ok++;if(v.signal)rows.push({...m,tf,...v,a:undefined,e:undefined,m:undefined,h:undefined,mac:undefined,sig:undefined})}catch(e){fail++}finally{done++}}));$('status').textContent=done+'/'+jobs.length+' · hợp lệ '+ok+' · thiếu/lỗi '+fail;render();await new Promise(r=>setTimeout(r,1100))}}catch(e){$('status').textContent=e.message}finally{busy=false}}function render(){const side=$('side').value;const filtered=rows.filter(x=>!side||x.signal===+side).sort((a,b)=>b.rvol-a.rvol);$('counts').textContent='LONG '+new Set(rows.filter(x=>x.signal===1).map(x=>x.coin)).size+' / SHORT '+new Set(rows.filter(x=>x.signal===-1).map(x=>x.coin)).size;const groups=new Map();for(const x of filtered){if(!groups.has(x.coin))groups.set(x.coin,[]);groups.get(x.coin).push(x)}$('results').replaceChildren(...Array.from(groups,([coin,items])=>{const d=document.createElement('article'),b=document.createElement('button');b.textContent=coin+' · '+items.length+' khung';b.onclick=()=>{$('coin').value=coin;$('tf').value=items[0].tf;chart()};d.append(b);for(const x of items){const p=document.createElement('p');p.className=x.signal>0?'long':'short';p.textContent=x.tf+' · '+(x.signal>0?'LONG':'SHORT')+' · '+x.kind+' · RVOL '+fmt(x.rvol)+'× · BW '+fmt(x.bw)+'%';d.append(p)}const p=document.createElement('small');p.textContent='OI '+fmt(items[0].oi)+' coin · Funding '+fmt(items[0].funding*100)+'% · WATCH';d.append(p);return d}))}async function chart(){const coin=$('coin').value,tf=$('tf').value,k=frames.indexOf(tf);active=coin+'|'+tf;if(ws)ws.close();$('chartstatus').textContent='Đang tải '+active;try{const end=Date.now(),a=await post({type:'candleSnapshot',req:{coin,interval:tf,startTime:end-ms[k]*121,endTime:end}});if(active!==coin+'|'+tf)return;let data=a.sort((a,b)=>a.t-b.t);function draw(){const cv=$('canvas'),w=cv.clientWidth||340,H=320;cv.width=w*devicePixelRatio;cv.height=H*devicePixelRatio;const c=cv.getContext('2d');c.scale(devicePixelRatio,devicePixelRatio);const a=data.slice(-100),lo=Math.min(...a.map(x=>+x.l)),hi=Math.max(...a.map(x=>+x.h)),y=v=>12+(hi-v)/(hi-lo||1)*240,dx=(w-65)/a.length;c.clearRect(0,0,w,H);a.forEach((x,i)=>{const X=8+i*dx;c.strokeStyle=c.fillStyle=+x.c>=+x.o?'#4de1a7':'#ff858c';c.beginPath();c.moveTo(X,y(+x.h));c.lineTo(X,y(+x.l));c.stroke();c.fillRect(X-dx*.3,Math.min(y(+x.o),y(+x.c)),Math.max(1,dx*.6),Math.max(1,Math.abs(y(+x.o)-y(+x.c))))});const prices=a.map(x=>+x.c);for(const [arr,col] of [[ema(prices,9),'#efc568'],[prices.map((_,i)=>i<19?NaN:prices.slice(i-19,i+1).reduce((s,v)=>s+v,0)/20),'#ad9aff']]){c.strokeStyle=col;c.beginPath();let started=false;arr.forEach((v,i)=>{if(!Number.isFinite(v))return;if(!started){c.moveTo(8+i*dx,y(v));started=true}else c.lineTo(8+i*dx,y(v))});c.stroke()}c.fillStyle='#dce7f5';c.font='12px sans-serif';c.fillText(fmt(hi),w-60,14);c.fillText(fmt(lo),w-60,252);c.fillText(coin+' '+tf+' · '+fmt(+a.at(-1).c),8,280)}draw();ws=new WebSocket('wss://api.hyperliquid.xyz/ws');const socket=ws;socket.onopen=()=>{socket.send(JSON.stringify({method:'subscribe',subscription:{type:'candle',coin,interval:tf}}));$('chartstatus').textContent='WS kết nối · chờ nến'};socket.onmessage=e=>{if(socket!==ws)return;const m=JSON.parse(e.data);if(m.channel!=='candle')return;const x=m.data;if(x.s!==coin||x.i!==tf)return;const i=data.findIndex(z=>z.t===x.t);if(i>=0)data[i]=x;else data.push(x);data=data.sort((a,b)=>a.t-b.t).slice(-121);$('chartstatus').textContent='LIVE '+new Date().toLocaleTimeString();draw()};socket.onclose=()=>{if(socket===ws)$('chartstatus').textContent='WS ngắt · mở lại biểu đồ'};socket.onerror=()=>{if(socket===ws)$('chartstatus').textContent='WS lỗi'}}catch(e){$('chartstatus').textContent=e.message}}$('scan').onclick=scan;$('stop').onclick=()=>stop=true;$('side').onchange=render;$('open').onclick=chart;load().catch(e=>$('status').textContent=e.message);</script></html>
