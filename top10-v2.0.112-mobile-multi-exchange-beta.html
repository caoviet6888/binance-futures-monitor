<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2.0.112 Mobile Multi Exchange — thử nghiệm</title><style>body{background:#0d1422;color:#e7eefb;font:14px system-ui;margin:8px}button,select{background:#20334d;color:white;border:1px solid #526b89;border-radius:8px;padding:10px;margin:3px}iframe{width:100%;height:85vh;border:0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #344b66;text-align:left}#status{padding:8px;color:#ffce72}</style><h2>V2.0.112 Mobile · Multi Exchange (Beta)</h2><label>Nguồn API <select id="source"><option value="binance">Binance</option><option value="bybit">Bybit</option><option value="auto">AUTO (thử nghiệm)</option></select></label><div id="status" role="status"></div><div id="view"></div><script type="module">
import {BybitMarket} from './bybit-market-v2.0.112.js';
const api=new BybitMarket(),sel=document.querySelector('#source'),view=document.querySelector('#view'),status=document.querySelector('#status');let epoch=0,ctl,timer;
try{sel.value=localStorage.getItem('mobile112.source')||'binance';if(!sel.value)sel.value='binance'}catch{}
function ema(a,n){let v=a[0],k=2/(n+1);return a.map(x=>v=v+k*(x-v))}
function binance(){const f=document.createElement('iframe');f.title='Binance V2.0.111';f.src='./top10-v2.0.111-mobile-api.html';view.replaceChildren(f);status.textContent='BINANCE · bộ lọc gốc V2.0.111; trạng thái kết nối xem trong bảng bên dưới.'}
async function bybit(id){view.innerHTML='<p>BYBIT · Bộ quét thử nghiệm EMA9/20 + MACD 12/26/9, chỉ nến đã đóng. Không phải toàn bộ thuật toán Binance. CVD, Footprint, Smart Entry, Top10 và TradFi chưa tích hợp.</p><select id="tf"><option>3m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option><option>1d</option></select><button id="scan">Quét Bybit</button><button id="stop">Dừng</button><div id="result"></div>';
const out=view.querySelector('#result'),btn=view.querySelector('#scan'),tf=view.querySelector('#tf');let run=0,scanCtl;
view.querySelector('#stop').onclick=()=>{run++;scanCtl?.abort();btn.disabled=false;status.textContent='BYBIT · đã dừng';};
btn.onclick=async()=>{const n=++run;scanCtl?.abort();scanCtl=new AbortController();const signal=scanCtl.signal;ctl.signal.addEventListener('abort',()=>scanCtl.abort(),{once:true});btn.disabled=true;out.replaceChildren();let rows=[],errors=0,done=0;const frame=tf.value,step=({'3m':3,'5m':5,'15m':15,'1h':60,'4h':240,'1d':1440})[frame]*60000;const active=()=>id===epoch&&n===run&&!signal.aborted;try{status.textContent='BYBIT · tải danh mục';const list=await api.instruments(signal);if(!active())return;let cursor=0;async function worker(){while(active()&&cursor<list.length){const sym=list[cursor++].symbol;try{const raw=await api.candles(sym,frame,200,signal);const a=raw.filter(x=>x.time+step<=Date.now());if(a.length<100||Date.now()-(a.at(-1).time+step)>step*1.5||a.some((x,i)=>i&&x.time-a[i-1].time!==step))throw Error('Missing/stale candles');const c=a.map(x=>x.close),e=ema(c,9),m=ema(c,20),f=ema(c,12),s=ema(c,26),d=f.map((x,i)=>x-s[i]),g=ema(d,9),i=c.length-1;const side=e[i]>m[i]&&d[i]>g[i]&&d[i-1]<=g[i-1]?'LONG':e[i]<m[i]&&d[i]<g[i]&&d[i-1]>=g[i-1]?'SHORT':'';if(side)rows.push([sym,side,c[i],new Date(a[i].time+step).toISOString()]);}catch(e){errors++}done++;if(active())status.textContent='BYBIT · '+done+'/'+list.length+' · lỗi '+errors;await new Promise(r=>setTimeout(r,250));}}await Promise.all([worker(),worker(),worker()]);if(!active())return;const table=document.createElement('table');for(const row of [['Mã','Tín hiệu','Giá','Nến đóng UTC'],...rows]){const tr=table.insertRow();for(const x of row)tr.insertCell().textContent=x;}out.replaceChildren(table);status.textContent='BYBIT · hoàn tất '+done+'/'+list.length+' · lỗi '+errors+' · tín hiệu '+rows.length;}catch(e){if(active())status.textContent='BYBIT · '+e.message;}finally{if(active())btn.disabled=false;}};
status.textContent='BYBIT · sẵn sàng quét thủ công';}
async function switchSource(){const id=++epoch;ctl?.abort();ctl=new AbortController();clearInterval(timer);view.replaceChildren();try{localStorage.setItem('mobile112.source',sel.value)}catch{}if(sel.value==='binance'){binance();return}if(sel.value==='bybit'){bybit(id);return}status.textContent='AUTO · kiểm tra Binance REST';let ok=false;try{const r=await fetch('https://fapi.binance.com/fapi/v1/time',{signal:ctl.signal,cache:'no-store'});const j=await r.json();ok=r.ok&&Number.isFinite(j.serverTime)}catch{}if(id!==epoch)return;if(ok)binance();else bybit(id);status.textContent='AUTO · '+(ok?'Binance':'Bybit')+' · chọn nguồn lúc mở; chưa tự phục hồi liên tục';}
sel.onchange=switchSource;switchSource();
</script></html>
