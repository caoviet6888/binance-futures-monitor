<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2.0.112 Mobile Multi Exchange — Beta 4</title><style>body{background:#0d1422;color:#e7eefb;font:14px system-ui;margin:8px}button,select{background:#20334d;color:white;border:1px solid #526b89;border-radius:8px;padding:10px;margin:3px}iframe{width:100%;height:85vh;border:0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #344b66;text-align:left}#status{padding:8px;color:#ffce72}.navB{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:10px 0}.navB button{margin:0;font-weight:700;font-size:13px;min-height:44px}.navB button.active{background:#eac566;color:#111827}.navB button:disabled{opacity:.45}.panelB{background:#15243a;border:1px solid #344b66;border-radius:12px;padding:10px;margin:10px 0}.statsB{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.statsB b{display:block;font-size:20px}.statsB small{color:#afc1d8}progress{width:100%}td{overflow-wrap:anywhere}td:last-child{font-size:11px}#result table{table-layout:fixed}#result th{font-size:12px}#result td{font-size:12px}#result td:first-child{font-weight:bold}#result details{margin:10px 0}button:disabled{opacity:.5}.navB button{font-weight:600;font-size:12px;min-height:40px;padding:7px}.navB button.active{color:#111827!important} </style><h2>V2.0.112 Mobile · Multi Exchange (Beta 4)</h2><label>Nguồn API <select id="source"><option value="binance">Binance</option><option value="bybit">Bybit</option><option value="auto">AUTO (thử nghiệm)</option></select></label><div id="status" role="status"></div><div id="view"></div><script type="module">
import {BybitMarket} from './bybit-market-v2.0.112.js';
const api=new BybitMarket(),sel=document.querySelector('#source'),view=document.querySelector('#view'),status=document.querySelector('#status');let epoch=0,ctl,timer;
try{sel.value=localStorage.getItem('mobile112b4.source')||'binance';if(!sel.value)sel.value='binance'}catch{}
function ema(a,n){let v=a[0],k=2/(n+1);return a.map(x=>v=v+k*(x-v))}
function binance(){const f=document.createElement('iframe');f.title='Binance V2.0.111';f.src='./top10-v2.0.111-mobile-api.html';view.replaceChildren(f);status.textContent='BINANCE · bộ lọc gốc V2.0.111; trạng thái kết nối xem trong bảng bên dưới.'}
async function bybit(id){view.innerHTML='<p>BYBIT · Beta 4: Radar EMA/MACD, nến thân ≥55% phá đỉnh/đáy trước cùng xu hướng EMA, Bollinger 20/2 và Squeeze (độ rộng thuộc 25% thấp nhất 40 nến trước, mở rộng >5%). Chỉ nến đóng; thuật toán thử nghiệm riêng, chưa tương đương Binance. Top10, TradFi, Live và Smart Entry chưa hỗ trợ.</p><select id="tf"><option>3m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option><option>1d</option></select><button id="scan">Quét Bybit</button><button id="stop">Dừng</button><div id="result"></div>';
const nav=document.createElement('div');nav.className='navB';const modes=[['RADAR','ALL'],['LONG','LONG'],['SHORT','SHORT'],['ĐÃ QUÉT','STATS'],['TOP 10 LONG',''],['TOP 10 SHORT',''],['NẾN LONG','CANDLE_LONG'],['NẾN SHORT','CANDLE_SHORT'],['TRADFI LONG',''],['TRADFI SHORT',''],['SQUEEZE LONG','SQ_LONG'],['SQUEEZE SHORT','SQ_SHORT'],['BOLL LONG','BB_LONG'],['BOLL SHORT','BB_SHORT'],['PRO TREND',''],['SMART ENTRY','']];let mode='ALL',snapshot=[],stats={done:0,total:0,errors:0};const buttons=[];for(const [label,key] of modes){const b=document.createElement('button');b.textContent=label+(key?'':' · Chưa hỗ trợ');b.disabled=!key;if(key==='LONG')b.style.color='#6ee7b7';if(key==='SHORT')b.style.color='#fca5a5';if(key==='ALL')b.classList.add('active');b.onclick=()=>{mode=mode===key?'':key;buttons.forEach(x=>x.b.classList.toggle('active',x.key===mode));renderB();if(mode)results.scrollIntoView({block:'nearest'});};buttons.push({b,key,label});nav.append(b);}view.prepend(nav);const panel=document.createElement('div');panel.className='panelB';panel.innerHTML='<div class="statsB"><div><small>Đã quét</small><b id="doneB">0/0</b></div><div><small>Hợp lệ</small><b id="okB">0</b></div><div><small>Lỗi</small><b id="errB">0</b></div></div><progress id="progressB" max="1" value="0"></progress>';nav.after(panel);const results=document.createElement('div');results.className='panelB';view.querySelector('#result').before(results);function matchesB(x,key){return key==='ALL'?x[4]==='RADAR':key==='LONG'||key==='SHORT'?x[4]==='RADAR'&&x[1]===key:x[4]===key;}function renderB(){if(id!==epoch)return;buttons.forEach(({b,key,label})=>{if(key&&key!=='STATS')b.textContent=label+' · '+snapshot.filter(x=>matchesB(x,key)).length;if(key==='STATS')b.textContent=label+' · '+stats.done+'/'+stats.total;});panel.querySelector('#doneB').textContent=stats.done+'/'+stats.total;panel.querySelector('#okB').textContent=stats.done-stats.errors;panel.querySelector('#errB').textContent=stats.errors;const p=panel.querySelector('progress');p.max=stats.total||1;p.value=stats.done;results.replaceChildren();results.hidden=!mode;if(!mode)return;if(mode==='STATS'){results.textContent='Đã xử lý '+stats.done+' mã · hợp lệ '+(stats.done-stats.errors)+' · lỗi '+stats.errors;return;}const title=document.createElement('strong');title.textContent='BYBIT · '+(mode==='ALL'?'RADAR EMA/MACD':mode);results.append(title);const list=snapshot.filter(x=>matchesB(x,mode)).sort((a,b)=>a[0].localeCompare(b[0]));if(!list.length){const p=document.createElement('p');p.textContent='Chưa có tín hiệu trong lượt quét hiện tại';results.append(p);return;}for(const [sym,side,price,time] of list){const row=document.createElement('div');row.style.cssText='padding:9px 0;border-bottom:1px solid #344b66;display:flex;justify-content:space-between;gap:8px';const a=document.createElement('strong');a.textContent=sym+' · '+side;a.style.color=side==='LONG'?'#6ee7b7':'#fca5a5';const b=document.createElement('small');b.textContent=price+' · '+time;row.append(a,b);results.append(row);}}renderB();const out=view.querySelector('#result'),btn=view.querySelector('#scan'),tf=view.querySelector('#tf');let run=0,scanCtl;
view.querySelector('#stop').onclick=()=>{run++;scanCtl?.abort();btn.disabled=false;status.textContent='BYBIT · đã dừng';};
btn.onclick=async()=>{const n=++run;scanCtl?.abort();scanCtl=new AbortController();const signal=scanCtl.signal;ctl.signal.addEventListener('abort',()=>scanCtl.abort(),{once:true});btn.disabled=true;out.replaceChildren();snapshot=[];stats={done:0,total:0,errors:0};renderB();let rows=[],errors=0,done=0,reasons={},failed=[];const frame=tf.value,step=({'3m':3,'5m':5,'15m':15,'1h':60,'4h':240,'1d':1440})[frame]*60000;const active=()=>id===epoch&&n===run&&!signal.aborted;try{status.textContent='BYBIT · tải danh mục';const list=await api.instruments(signal);if(!active())return;stats.total=list.length;renderB();let cursor=0;async function worker(){while(active()&&cursor<list.length){const sym=list[cursor++].symbol;try{let raw;for(let attempt=0;attempt<3;attempt++){try{raw=await api.candles(sym,frame,200,signal);break}catch(err){if(signal.aborted||attempt===2)throw err;await new Promise(r=>setTimeout(r,Math.max(700*(attempt+1),api.pauseUntil-Date.now())));}}const a=raw.filter(x=>x.time+step<=Date.now());if(a.length<100)throw Error('Thiếu lịch sử nến');if(Date.now()-(a.at(-1).time+step)>step*1.5)throw Error('Nến quá cũ');if(a.some((x,i)=>i&&x.time-a[i-1].time!==step))throw Error('Hở nến');const c=a.map(x=>x.close),e=ema(c,9),m=ema(c,20),f=ema(c,12),s=ema(c,26),d=f.map((x,i)=>x-s[i]),g=ema(d,9),i=c.length-1;const side=e[i]>m[i]&&d[i]>g[i]&&d[i-1]<=g[i-1]?'LONG':e[i]<m[i]&&d[i]<g[i]&&d[i-1]>=g[i-1]?'SHORT':'';const stamp=new Date(a[i].time+step).toLocaleString('vi-VN',{hour12:false});const add=(side,kind)=>rows.push([sym,side,c[i],stamp,kind]);if(side)add(side,'RADAR');const k=a[i],prev=a[i-1],range=k.high-k.low,body=Math.abs(k.close-k.open);if(range>0&&body/range>=0.55){if(k.close>k.open&&k.close>prev.high&&e[i]>m[i])add('LONG','CANDLE_LONG');if(k.close<k.open&&k.close<prev.low&&e[i]<m[i])add('SHORT','CANDLE_SHORT');}function bands(j){const z=c.slice(j-19,j+1),mean=z.reduce((p,q)=>p+q,0)/20,sd=Math.sqrt(z.reduce((p,q)=>p+(q-mean)**2,0)/20);return {up:mean+2*sd,lo:mean-2*sd,width:4*sd/mean};}const b=bands(i),p=bands(i-1),history=Array.from({length:40},(_,j)=>bands(i-41+j).width).sort((a,b)=>a-b);const squeeze=p.width<=history[9]&&b.width>p.width*1.05;if(c[i]>b.up&&c[i-1]<=p.up&&k.close>k.open){add('LONG','BB_LONG');if(squeeze)add('LONG','SQ_LONG');}if(c[i]<b.lo&&c[i-1]>=p.lo&&k.close<k.open){add('SHORT','BB_SHORT');if(squeeze)add('SHORT','SQ_SHORT');}}catch(e){errors++;const reason=String(e.message||e);reasons[reason]=(reasons[reason]||0)+1;failed.push([sym,reason]);}done++;if(active()){snapshot=rows.slice();stats={done,total:list.length,errors};if(done%10===0||done===list.length)renderB();}if(active())status.textContent='BYBIT · '+done+'/'+list.length+' · lỗi '+errors;await new Promise(r=>setTimeout(r,350));}}await Promise.all([worker(),worker()]);if(!active())return;const table=document.createElement('table');for(const row of [['Mã','Tín hiệu','Giá đóng','Giờ địa phương'],...rows.sort((a,b)=>a[1].localeCompare(b[1])||a[0].localeCompare(b[0]))]){const tr=table.insertRow();for(const x of row){const td=tr.insertCell();td.textContent=x;if(x==='LONG')td.style.color='#6ee7b7';if(x==='SHORT')td.style.color='#fca5a5';}}snapshot=rows.slice();stats={done,total:list.length,errors};renderB();out.replaceChildren();const diag=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Chi tiết lỗi ('+errors+')';diag.append(summary);const p=document.createElement('pre');p.style.whiteSpace='pre-wrap';p.textContent=Object.entries(reasons).map(([k,v])=>k+': '+v).join('\n')+'\n\n'+failed.map(x=>x.join(' · ')).join('\n');diag.append(p);out.prepend(diag);status.textContent='BYBIT · hoàn tất '+done+'/'+list.length+' · hợp lệ '+(done-errors)+' · lỗi '+errors+' · Radar '+rows.filter(x=>x[4]==='RADAR').length;}catch(e){if(active())status.textContent='BYBIT · '+e.message;}finally{if(active())btn.disabled=false;}};
status.textContent='BYBIT · sẵn sàng quét thủ công';}
async function switchSource(){const id=++epoch;ctl?.abort();ctl=new AbortController();clearInterval(timer);view.replaceChildren();try{localStorage.setItem('mobile112b4.source',sel.value)}catch{}if(sel.value==='binance'){binance();return}if(sel.value==='bybit'){bybit(id);return}status.textContent='AUTO · kiểm tra Binance REST';let ok=false;try{const r=await fetch('https://fapi.binance.com/fapi/v1/time',{signal:ctl.signal,cache:'no-store'});const j=await r.json();ok=r.ok&&Number.isFinite(j.serverTime)}catch{}if(id!==epoch)return;if(ok)binance();else bybit(id);status.textContent='AUTO · '+(ok?'Binance':'Bybit')+' · chọn nguồn lúc mở; chưa tự phục hồi liên tục';}
sel.onchange=switchSource;switchSource();
</script></html>
