<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LONG SHORT Scanner V2.0.42 Test</title><style>body{font:15px system-ui;background:#0c1524;color:#eaf2ff;margin:auto;max-width:900px;padding:14px}button,select{padding:11px;background:#263b59;color:white;border:1px solid #59708f;border-radius:8px;margin:4px}button{cursor:pointer}article{background:#17263c;border:1px solid #39506d;border-radius:9px;margin:8px 0;padding:12px}.long{color:#4de0a6}.short{color:#ff8b91}small{color:#aec1d8}progress{width:100%}</style></head><body><h2>Binance LONG / SHORT · V2.0.42 TEST</h2><p>Máy quét độc lập · MACD 12/26/9 + EMA 9/20 · nến đóng · giao cắt tối đa 3 nến.</p><button id="go">⚡ QUÉT NGAY</button><button id="stop" disabled>DỪNG</button><select id="count"><option value="30">30 mã</option><option value="100" selected>100 mã</option><option value="200">200 mã</option></select><select id="side"><option value="all">LONG + SHORT</option><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select><select id="level"><option value="all">Tất cả</option><option value="strong">MẠNH</option><option value="confirm">XÁC NHẬN</option><option value="early">SỚM</option></select><progress id="progress" value="0" max="1"></progress><p id="status">Sẵn sàng. Chỉ quét nhóm mã có volume 24h cao nhất theo số lượng đã chọn.</p><div id="results"></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x);let job=0,records=[];const frames=['3m','5m','15m','1h','4h'],rank={strong:3,confirm:2,early:1},label={strong:'MẠNH',confirm:'XÁC NHẬN',early:'SỚM'};function ema(a,n){let v=a[0],k=2/(n+1);return a.map((x,i)=>v=i?v+(x-v)*k:x)}function analyze(rows){const c=rows.slice(0,-1).map(x=>+x[4]);if(c.length<60)return null;const a=ema(c,12),b=ema(c,26),m=a.map((v,i)=>v-b[i]),s=ema(m,9),h=m.map((v,i)=>v-s[i]),e9=ema(c,9),e20=ema(c,20),n=c.length-1;let cross=0,age=99;for(let j=n;j>=n-2;j--){if(h[j]>0&&h[j-1]<=0){cross=1;age=n-j;break}if(h[j]<0&&h[j-1]>=0){cross=-1;age=n-j;break}}return {cross,age,mac:Math.sign(h[n]),ema:Math.sign(e9[n]-e20[n])}}function classify(arr,dir){if(!arr.some(x=>x?.cross===dir))return null;const mc=arr.filter(x=>x?.mac===dir).length,em=arr.filter(x=>x?.ema===dir).length;return {level:mc>=3&&em>=2?'strong':mc>=2&&em>=1?'confirm':'early',mc,em,fresh:arr.map((x,i)=>x?.cross===dir?frames[i]+' ('+(x.age+1)+' nến)':'').filter(Boolean).join(', ')}}function render(){const side=$('side').value,lev=$('level').value;$('results').replaceChildren();const shown=records.filter(x=>(side==='all'||x.side===side)&&(lev==='all'||x.level===lev));for(const r of shown){const a=document.createElement('article'),b=document.createElement('b'),p=document.createElement('p');b.className=r.side==='LONG'?'long':'short';b.textContent=r.symbol+' · '+r.side+' · '+label[r.level];p.textContent='MACD '+r.mc+'/5 · EMA '+r.em+'/5 · Giao cắt: '+r.fresh;a.append(b,p);$('results').append(a)}if(!shown.length)$('results').textContent='Không có tín hiệu phù hợp trong số mã đã quét.'}async function get(path){let last;for(const host of ['https://fapi.binance.com','https://fapi1.binance.com','https://fapi2.binance.com']){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);try{const r=await fetch(host+path,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error(host+' HTTP '+r.status);const data=await r.json();clearTimeout(timer);return data}catch(e){last=e;clearTimeout(timer)}}throw Error('Không truy cập được API Binance Futures từ trình duyệt: '+(last?.message||'không rõ'))}async function scan(){const id=++job;records=[];render();$('status').textContent='Đã nhận lệnh quét. Đang kết nối Binance Futures...';$('go').disabled=true;$('stop').disabled=false;let done=0,errors=0;try{const [info,ticks]=await Promise.all([get('/fapi/v1/exchangeInfo'),get('/fapi/v1/ticker/24hr')]);const valid=new Set(info.symbols.filter(x=>x.status==='TRADING'&&x.quoteAsset==='USDT'&&x.contractType==='PERPETUAL').map(x=>x.symbol));$('status').textContent='Đã kết nối Binance. Đang lấy danh sách mã...';const symbols=ticks.filter(x=>valid.has(x.symbol)).sort((a,b)=>(+b.quoteVolume||0)-(+a.quoteVolume||0)).slice(0,+$('count').value).map(x=>x.symbol);$('progress').max=symbols.length;if(!symbols.length)throw Error('Không tìm thấy hợp đồng USDT perpetual từ dữ liệu Binance');for(let i=0;i<symbols.length&&id===job;i+=3){await Promise.all(symbols.slice(i,i+3).map(async symbol=>{try{const arr=await Promise.all(frames.map(tf=>get('/fapi/v1/klines?symbol='+encodeURIComponent(symbol)+'&interval='+tf+'&limit=110').then(analyze)));for(const dir of [1,-1]){const x=classify(arr,dir);if(x)records.push({symbol,side:dir===1?'LONG':'SHORT',...x})}}catch(e){errors++}finally{done++;$('progress').value=done}}));records.sort((a,b)=>rank[b.level]-rank[a.level]||b.mc-a.mc);render();$('status').textContent='Đã quét '+done+'/'+symbols.length+' · lỗi '+errors+' · tín hiệu '+records.length}}catch(e){$('status').textContent='Lỗi kết nối Binance: '+e.message+' — nếu Binance bị chặn hoặc CORS thất bại, trình duyệt không thể quét.'}finally{if(id===job){$('go').disabled=false;$('stop').disabled=true}}} $('go').onclick=scan;$('stop').onclick=()=>{job++;$('go').disabled=false;$('stop').disabled=true;$('status').textContent+=' · Đã dừng'};$('side').onchange=render;$('level').onchange=render;
})();</script></body></html>
