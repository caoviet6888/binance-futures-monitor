<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Binance Futures Monitor v4.16.1</title><style>html,body{margin:0;height:100%;background:#0b1220;color:#e9f1fc;font:16px system-ui}iframe{border:0;width:100%;height:100dvh;display:block}#error{display:none;padding:24px;line-height:1.7}</style></head><body><iframe id="base" src="./index-v4-15-3-valid-entry-first.html" title="Binance Futures Monitor"></iframe><div id="error"><h2>Không thể mở bộ quét nền</h2><p>Hãy giữ cả file <b>index-v4-15-3-valid-entry-first.html</b> và file này trong cùng thư mục gốc GitHub Pages.</p></div><script id="enhancement" type="text/plain">
(function(){
'use strict';
const el=id=>document.getElementById(id);
const baseSelect=selectedEvents,baseRender=render,baseAnalyse=analyse;
const modes=[['focus','🎯 Ưu tiên READY / gần đạt'],['readyonly','✅ Chỉ READY TRADE'],['rejectedonly','🧪 Tín hiệu bị loại (đối chứng)']];
const state=el('state');for(const [v,label] of modes){if(!state.querySelector('option[value="'+v+'"]')){const o=new Option(label,v);state.insertBefore(o,state.firstChild)}}
// Do not change any risk threshold or manufacture a READY signal.
function eligible(e){const p=tradePlan(e,relatedSignals(e));return p.actionable===true&&p.status==='READY TRADE'}
function nearReady(e){const p=tradePlan(e,relatedSignals(e)),q=qualityAssessment(e,relatedSignals(e));if(eligible(e))return true;return e.valid&&e.age<2&&p.status==='WAIT ENTRY'&&q.score>=65&&independentFamilies(relatedSignals(e))>=1&&!/SL quá rộng|vượt giới hạn|Chưa có giá thị trường|quá hạn/i.test(p.reason||'')}
function ranked(e){if(eligible(e))return 3;if(nearReady(e))return 2;return 0}
selectedEvents=function(){const mode=state.value;if(!['focus','readyonly','rejectedonly'].includes(mode))return baseSelect();state.value='all';let rows;try{rows=baseSelect()}finally{state.value=mode}rows=rows.filter(e=>mode==='readyonly'?eligible(e):mode==='rejectedonly'?!nearReady(e):nearReady(e));return rows.sort((a,b)=>ranked(b)-ranked(a)||qualityAssessment(b,relatedSignals(b)).score-qualityAssessment(a,relatedSignals(a)).score||b.time-a.time)};
// Retrospective EMA9/20 crosses, computed only on closed candles.
const crossRecords=new Map();
function crosses(klines,tf,symbol){const k=klines.filter(x=>+x[6]<Date.now());if(k.length<75)return [];const c=k.map(x=>+x[4]),e9=ema(c,9),e20=ema(c,20),fast=macd(c,8,17,9),standard=macd(c,12,26,9),out=[];
for(let i=45;i<k.length;i++){const side=e9[i-1]<=e20[i-1]&&e9[i]>e20[i]?'LONG':e9[i-1]>=e20[i-1]&&e9[i]<e20[i]?'SHORT':null;if(!side)continue;const a=atr(k.slice(0,i+1));if(!Number.isFinite(a)||a<=0)continue;const d=side==='LONG'?1:-1,entry=c[i],sl=entry-d*1.5*a,tp=entry+d*3*a;if(sl<=0||tp<=0)continue;let result='PENDING';let elapsed=0;for(let j=i+1;j<=Math.min(i+6,k.length-1);j++){elapsed=j-i;const hi=+k[j][2],lo=+k[j][3],hitSL=d===1?lo<=sl:hi>=sl,hitTP=d===1?hi>=tp:lo<=tp;if(hitSL&&hitTP){result='AMBIGUOUS';break}if(hitSL){result='SL';break}if(hitTP){result='TP';break}}if(result==='PENDING'&&k.length-1-i>=6)result='NO_HIT_6';out.push({symbol,tf,side,time:+k[i][6],entry,sl,tp,result,elapsed,macdFast:d*(fast.line[i]-fast.signal[i])>0,macdStandard:d*(standard.line[i]-standard.signal[i])>0})}return out}
analyse=function(k,meta,tf){const result=baseAnalyse(k,meta,tf);if(result)crossRecords.set(meta.symbol+'|'+tf,crosses(k,tf,meta.symbol));return result};
const panel=document.createElement('section');panel.className='panel';panel.style.marginTop='12px';panel.innerHTML='<h2>🎯 v4.16.1 · Chất lượng điểm vào & kiểm chứng</h2><p class="muted">READY TRADE vẫn phải vượt toàn bộ điều kiện kỹ thuật, giá cập nhật và SL tối đa do bạn đặt. WAIT ENTRY gần đạt chỉ để theo dõi, KHÔNG phải điểm vào hợp lệ. Mặc định ẩn INVALID và EXTENDED; có chế độ đối chứng riêng.</p><div class="actions"><button id="qfocus">🎯 READY + gần đạt</button><button id="qready">✅ Chỉ READY</button><button id="qreject">🧪 Xem bị loại</button><button id="qexport">⬇ CSV kiểm chứng</button></div><div id="qcounts" class="muted" style="margin:10px 0">Chưa có dữ liệu quét.</div><h3>Giao cắt EMA9/20 LONG / SHORT · theo khung</h3><p class="muted">Hồi cứu trên nến đóng: entry = đóng nến giao cắt, SL = 1,5 ATR, TP = 3 ATR, tối đa 6 nến. Chạm cả TP/SL trong cùng nến = không xác định. Mẫu chưa đủ 6 nến và hết 6 nến chưa chạm được tách riêng. MACD là điều kiện phân nhóm, không phải giao cắt đồng thời. Không tính phí/funding/trượt giá.</p><div class="tablewrap" id="qaudit">Chưa có dữ liệu.</div>';
const metrics=el('metrics');if(metrics?.parentElement)metrics.parentElement.insertAdjacentElement('afterend',panel);else document.querySelector('main')?.append(panel);
function rows(){return [...crossRecords.values()].flat()}
function counts(a){const n=t=>a.filter(x=>x.result===t).length,tp=n('TP'),sl=n('SL');return {total:a.length,tp,sl,pending:n('PENDING'),nohit:n('NO_HIT_6'),amb:n('AMBIGUOUS'),rate:tp+sl?(100*tp/(tp+sl)).toFixed(1)+'%':'—'}}
function refreshAudit(){const all=rows(),c=counts(all);let ready=0,near=0,rejected=0;const saved=state.value;state.value='all';let signals=[];try{signals=baseSelect()}finally{state.value=saved}for(const e of signals){if(eligible(e))ready++;else if(nearReady(e))near++;else rejected++}el('qcounts').textContent='Tín hiệu đang xét: READY '+ready+' · WAIT gần đạt '+near+' · Còn lại '+rejected+' (trong phạm vi các bộ lọc hiện hành). Giao cắt hồi cứu '+c.total+' · TP '+c.tp+' / SL '+c.sl+' · Chưa đủ nến '+c.pending+' · Hết 6 nến '+c.nohit+' · Không rõ '+c.amb+' · TP/(TP+SL) '+c.rate+'.';
let html='<table><thead><tr><th>Khung</th><th>Chiều</th><th>MACD</th><th>Tổng</th><th>TP</th><th>SL</th><th>Chưa đủ</th><th>Hết 6 nến</th><th>Không rõ</th><th>TP/(TP+SL)</th></tr></thead><tbody>';for(const tf of ['5m','15m','1h','4h','1d'])for(const side of ['LONG','SHORT'])for(const group of ['all','fast','both']){const a=all.filter(x=>x.tf===tf&&x.side===side&&(group==='all'||group==='fast'&&x.macdFast||group==='both'&&x.macdFast&&x.macdStandard)),v=counts(a);html+='<tr><td>'+tf.toUpperCase()+'</td><td>'+side+'</td><td>'+(group==='all'?'Tất cả':group==='fast'?'MACD nhanh':'Cả 2 MACD')+'</td><td>'+v.total+'</td><td>'+v.tp+'</td><td>'+v.sl+'</td><td>'+v.pending+'</td><td>'+v.nohit+'</td><td>'+v.amb+'</td><td>'+v.rate+'</td></tr>'}el('qaudit').innerHTML=html+'</tbody></table>'}
let last=0;render=function(){baseRender();if(Date.now()-last>1200){last=Date.now();refreshAudit()}};
for(const [id,mode] of [['qfocus','focus'],['qready','readyonly'],['qreject','rejectedonly']])el(id).onclick=()=>{state.value=mode;el('sort').value='entry';render();el('signalCards')?.scrollIntoView({behavior:'smooth',block:'start'})};
el('qexport').onclick=()=>{const a=rows(),keys=['symbol','tf','side','time','entry','sl','tp','result','elapsed','macdFast','macdStandard'];const csv=[keys.join(','),...a.map(x=>keys.map(k=>'"'+String(k==='time'?new Date(x[k]).toISOString():x[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=u;link.download='v4161-ema-cross-audit.csv';link.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
state.value='focus';el('sort').value='entry';document.querySelector('h1')?.insertAdjacentHTML('afterend','<p class="muted">v4.16.1 · Mặc định ưu tiên READY TRADE và WAIT gần đạt; giữ nguyên bộ quét, CoinGecko, biểu đồ và quản trị rủi ro v4.15.3.</p>');render();
})();
</script><script>const f=document.getElementById('base');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d||!d.getElementById('start'))throw Error('Không đọc được file nền');const s=d.createElement('script');s.textContent=document.getElementById('enhancement').textContent;d.body.append(s);if(!d.getElementById('qcounts'))throw Error('Không khởi tạo được nâng cấp');}catch(e){f.style.display='none';const b=document.getElementById('error');b.style.display='block';const p=document.createElement('p');p.textContent='Chi tiết: '+e.message;b.append(p)}})</script></body></html>
